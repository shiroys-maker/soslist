<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>予約詳細</title>
    <style>
        :root {
            --details-bg: #eef4f8;
            --details-surface: #ffffff;
            --details-border: #d4dbe3;
            --details-text: #243447;
            --details-muted: #5f7285;
            --details-accent: #1e6bb8;
            --details-accent-hover: #14538f;
            --details-shadow: 0 14px 32px rgba(36, 52, 71, 0.12);
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: "Helvetica Neue", "Hiragino Sans", sans-serif;
            color: var(--details-text);
            background:
                radial-gradient(circle at top left, rgba(30, 107, 184, 0.12), transparent 28%),
                linear-gradient(180deg, #f4f8fb 0%, var(--details-bg) 100%);
        }

        .page {
            width: min(1020px, calc(100vw - 32px));
            min-height: calc(100vh - 32px);
            margin: 16px auto;
            padding: 24px;
            border-radius: 18px;
            background: var(--details-surface);
            box-shadow: var(--details-shadow);
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
            border-bottom: 1px solid var(--details-border);
            padding-bottom: 12px;
        }

        .page-title {
            margin: 0;
            font-size: 30px;
            font-weight: 700;
            letter-spacing: 0.02em;
        }

        .action-bar {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }

        .detail-grid {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 10px;
        }

        .detail-card,
        .notes-card {
            border: 1px solid var(--details-border);
            border-radius: 14px;
            background: #fbfdff;
            padding: 13px 14px;
        }

        .detail-card.full-span {
            grid-column: 1 / -1;
        }

        .detail-label {
            display: block;
            margin-bottom: 6px;
            color: var(--details-muted);
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 0.04em;
        }

        .detail-value {
            font-size: 15px;
            line-height: 1.35;
            word-break: break-word;
            white-space: pre-wrap;
        }

        .referral-chip-row {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .referral-chip {
            border: none;
            border-radius: 999px;
            padding: 5px 10px;
            font: inherit;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            color: #fff;
            background: #2b7ac6;
        }

        .referral-chip:hover {
            background: #195d9b;
        }

        .referral-chip-saved {
            background: #2c9a64;
        }

        .referral-chip-saved:hover {
            background: #21754b;
        }

        .notes-card {
            display: flex;
            flex-direction: column;
            flex: 1;
            min-height: 0;
        }

        .notes-card textarea {
            width: 100%;
            min-height: 340px;
            flex: 1;
            margin-top: 8px;
            padding: 14px;
            border: 1px solid var(--details-border);
            border-radius: 12px;
            resize: vertical;
            font: inherit;
            line-height: 1.6;
            color: var(--details-text);
            background: #fff;
        }

        .detail-input {
            width: 100%;
            margin: 2px 0 14px;
            padding: 10px 12px;
            border: 1px solid var(--details-border);
            border-radius: 10px;
            font: inherit;
            color: var(--details-text);
            background: #fff;
        }

        .reference-link {
            display: inline-block;
            margin: -4px 0 16px;
            color: var(--details-accent);
            font-size: 13px;
            line-height: 1.5;
            word-break: break-all;
        }

        .reference-link.is-hidden {
            display: none;
        }

        .button-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            margin-top: 16px;
        }

        .status-text {
            min-height: 20px;
            font-size: 14px;
            color: var(--details-muted);
        }

        .button-group {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        button {
            border: none;
            border-radius: 999px;
            padding: 5px 10px;
            font: inherit;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            color: #fff;
            background: var(--details-accent);
        }

        button:hover {
            background: var(--details-accent-hover);
        }

        button.secondary {
            background: #728197;
        }

        button.secondary:hover {
            background: #576578;
        }

        button:disabled {
            cursor: not-allowed;
            opacity: 0.5;
        }

        .qtc-tool-button {
            min-width: 52px;
        }

        .utility-tool-button {
            min-width: 62px;
        }

        .loading,
        .error {
            margin: auto;
            text-align: center;
            color: var(--details-muted);
            font-size: 16px;
        }

        @media (max-width: 720px) {
            .page {
                width: calc(100vw - 20px);
                min-height: calc(100vh - 20px);
                margin: 10px auto;
                padding: 18px;
            }

            .detail-grid {
                grid-template-columns: 1fr;
            }

            .page-header,
            .button-row {
                flex-direction: column;
                align-items: stretch;
            }

            .button-group {
                width: 100%;
            }

            .button-group button,
            .action-bar button {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div id="detailsRoot" class="loading">読み込み中...</div>

    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>
    <script src="config.js"></script>
    <script src="details.js"></script>
</body>
</html>
